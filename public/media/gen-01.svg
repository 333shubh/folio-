<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="sky0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93a6b0"/>
      <stop offset="100%" stop-color="#93a6b0" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="wat0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4e626d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4e626d"/>
    </linearGradient>
    <radialGradient id="soft0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur0"><feGaussianBlur stdDeviation="14.0"/></filter>
  </defs>

  <rect width="640" height="400" fill="url(#sky0)"/>
  <rect y="220.0" width="640" height="180.0" fill="url(#wat0)"/>

  <g filter="url(#blur0)"><circle cx="128.0" cy="100.0" r="88.0" fill="url(#soft0)" opacity="0.28"/><circle cx="435.2" cy="244.0" r="128.0" fill="url(#soft0)" opacity="0.28"/><circle cx="230.4" cy="100.0" r="168.0" fill="url(#soft0)" opacity="0.28"/></g>

  <!-- horizon glow, the thing that makes a flat gradient read as a place -->
  <rect y="215.2" width="640" height="9.6" fill="#ffffff" opacity="0.2" filter="url(#blur0)"/>
</svg>