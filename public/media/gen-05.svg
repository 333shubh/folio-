<svg xmlns="http://www.w3.org/2000/svg" width="380" height="520" viewBox="0 0 380 520">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5d87ad"/>
      <stop offset="100%" stop-color="#5d87ad" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="wat4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3450" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1d3450"/>
    </linearGradient>
    <radialGradient id="soft4">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur4"><feGaussianBlur stdDeviation="13.3"/></filter>
  </defs>

  <rect width="380" height="520" fill="url(#sky4)"/>
  <rect y="260.0" width="380" height="260.0" fill="url(#wat4)"/>

  <g filter="url(#blur4)"><circle cx="319.2" cy="130.0" r="121.6" fill="url(#soft4)" opacity="0.28"/><circle cx="197.6" cy="317.2" r="159.6" fill="url(#soft4)" opacity="0.28"/><circle cx="76.0" cy="130.0" r="83.6" fill="url(#soft4)" opacity="0.28"/></g>

  <!-- horizon glow, the thing that makes a flat gradient read as a place -->
  <rect y="253.8" width="380" height="12.5" fill="#ffffff" opacity="0.2" filter="url(#blur4)"/>
</svg>