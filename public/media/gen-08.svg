<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560">
  <defs>
    <linearGradient id="sky7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f4a59"/>
      <stop offset="100%" stop-color="#3f4a59" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="wat7" x1="0" y1="0" x2="0" y2="1">
