<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340">
  <defs>
    <linearGradient id="sky11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfab88"/>
      <stop offset="100%" stop-color="#cfab88" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="wat11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d4525" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7d4525"/>
    </linearGradient>
    <radialGradient id="soft11">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
