<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560">
  <defs>
    <linearGradient id="sky8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b4b9b5"/>
      <stop offset="100%" stop-color="#b4b9b5" stop-opacity="0.75"/>
