<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340">
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8c3a4"/>
      <stop offset="100%" stop-color="#d8c3a4" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="wat5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c6a3f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9c6a3f"/>
    </linearGradient>
    <radialGradient id="soft5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur5"><feGaussianBlur stdDeviation="11.9"/></filter>
  </defs>

  <rect width="520" height="340" fill="url(#sky5)"/>
  <rect y="224.4" width="520" height="115.6" fill="url(#wat5)"/>

  <g filter="url(#blur5)"><circle cx="104.0" cy="146.2" r="142.8" fill="url(#soft5)" opacity="0.28"/><circle cx="353.6" cy="268.6" r="74.8" fill="url(#soft5)" opacity="0.28"/><circle cx="187.2" cy="146.2" r="108.8" fill="url(#soft5)" opacity="0.28"/></g>

  <!-- horizon glow, the thing that makes a flat gradient read as a place -->
  <rect y="220.3" width="520" height="8.2" fill="#ffffff" opacity="0.2" filter="url(#blur5)"/>
</svg>